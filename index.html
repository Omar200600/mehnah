<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduAvatar - 3D Axis</title>
  <style>
    body {
      margin: 0;
      font-family: "Tahoma", sans-serif;
      background-color: #121212;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #1e1e1e;
      padding: 1rem;
      text-align: center;
      border-bottom: 2px solid #00bcd4;
    }
    header h1 { margin: 0; font-size: 1.8rem; color: #00bcd4; }
    .container { flex: 1; display: flex; flex-direction: row; }
    .stage {
      flex: 2; background: #1a1a1a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border-right: 2px solid #00bcd4; padding: 1rem;
    }
    .board {
      width: 90%; height: 60%;
      background: #2c2c2c; border: 2px solid #00bcd4;
      border-radius: 8px; margin-bottom: 1rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: #00bcd4;
    }
    .avatar {
      width: 120px; height: 120px; border-radius: 50%;
      background: radial-gradient(circle, #00bcd4, #0097a7);
      display: flex; align-items: center; justify-content: center;
      animation: pulse 2s infinite; font-weight: bold; color: #fff;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
    .chat {
      flex: 1.2; display: flex; flex-direction: column;
      background: #1e1e1e; padding: 1rem;
    }
    .messages {
      flex: 1; overflow-y: auto; margin-bottom: 1rem;
      border: 1px solid #00bcd4; border-radius: 6px; padding: 0.5rem;
    }
    .message {
      margin: 0.5rem 0; padding: 0.5rem; border-radius: 6px;
      max-width: 80%; word-wrap: break-word;
    }
    .ai { background: #00bcd4; color: #000; align-self: flex-start; }
    .user { background: #333; color: #fff; align-self: flex-end; }
    .input-area { display: flex; gap: 0.5rem; }
    .input-area input {
      flex: 1; padding: 0.5rem;
      border: 1px solid #00bcd4; border-radius: 4px;
      background: #222; color: #f0f0f0;
    }
    .input-area button {
      padding: 0.5rem 1rem; border: none; border-radius: 4px;
      background: #00bcd4; color: #000; font-weight: bold; cursor: pointer;
    }
    .input-area button:hover { background: #0097a7; }
    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .stage { border-right: none; border-bottom: 2px solid #00bcd4; }
    }
  </style>
</head>
<body>
  <header>
    <h1>EduAvatar - 3D Axis</h1>
  </header>
  <div class="container">
    <div class="stage">
      <div class="board">📖 السبورة الافتراضية</div>
      <div class="avatar">AI</div>
    </div>
    <div class="chat">
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب سؤالك أو رسالتك...">
        <button onclick="sendMessage()">إرسال</button>
      </div>
    </div>
  </div>

  <script>
    const messagesDiv = document.getElementById("messages");

    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.classList.add("message", sender);
      msg.textContent = text;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if(text !== "") {
        addMessage(text, "user");
        input.value = "";

        try {
          const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
              "Authorization": "Bearer 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",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: "google/gemma-2-9b-it:free",
              messages: [{ role: "user", content: text }]
            })
          });

          if (!response.ok) {
            throw new Error("فشل الاتصال بالخادم: " + response.status);
          }

          const data = await response.json();
          const reply = data.choices?.[0]?.message?.content || "لم أتمكن من الرد حالياً.";
          addMessage(reply, "ai");
          speak(reply);

        } catch (error) {
          console.error("خطأ:", error);
          addMessage("⚠️ حدث خطأ أثناء جلب الرد. تأكد من الاتصال بالإنترنت أو صحة الإعدادات.", "ai");
        }
      }
    }

    // ترحيب صوتي عند التحميل
    window.onload = () => {
      const welcome = "مرحباً بك في منصة EduAvatar داخل 3D Axis. أنا مرشدك الذكي، ما الموضوع أو المهنة التي تود تعلمها اليوم؟";
      addMessage(welcome, "ai");
      speak(welcome);
    };

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ar-SA";
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
