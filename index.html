<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>أكاديمية المهن والتعليم الذكي - 3D Axis</title>
  <!-- مكتبة html2pdf لتصدير الدرس كـ ملف PDF احترافي -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --primary-color: #00bcd4;
      --primary-hover: #0097a7;
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --border-color: #00bcd4;
      --sidebar-width: 280px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background-color: var(--bg-dark);
      color: #f0f0f0; font-family: "Tahoma", sans-serif;
      overflow: hidden;
    }
    body { display: flex; flex-direction: column; }
    
    header {
      background: var(--card-bg); padding: 8px 12px;
      text-align: center; border-bottom: 2px solid var(--border-color);
      flex-shrink: 0; display: flex; justify-content: space-between; align-items: center;
      z-index: 10;
    }
    header div h1 { margin: 0; font-size: 1.1rem; color: var(--primary-color); }
    header div p { margin: 1px 0 0 0; font-size: 0.65rem; color: #aaa; }
    
    .header-btns { display: flex; gap: 6px; }
    .btn-tool {
      background: #263238; border: 1px solid var(--primary-color);
      color: var(--primary-color); padding: 5px 9px; border-radius: 5px;
      cursor: pointer; font-size: 0.75rem; font-weight: bold;
    }
    .btn-tool:hover { background: #00838f; color: #fff; }

    /* Layout Wrapper */
    .app-body {
      flex: 1; display: flex; overflow: hidden; position: relative;
    }

    /* Sidebar For Saved Careers / Sessions */
    .sidebar {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: var(--sidebar-width); background: #181818;
      border-left: 2px solid var(--border-color); display: flex; flex-direction: column;
      padding: 10px; transition: transform 0.3s ease; flex-shrink: 0;
      z-index: 100; transform: translateX(100%);
      box-shadow: -4px 0 15px rgba(0,0,0,0.7);
    }
    .sidebar.open { transform: translateX(0); }
    
    .sidebar-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid #333;
    }
    .btn-close-sidebar {
      background: none; border: none; color: #ff5252; font-size: 1.1rem; cursor: pointer;
    }
    .btn-new-chat {
      width: 100%; background: var(--primary-color); color: #000;
      border: none; padding: 10px; border-radius: 6px; font-weight: bold;
      cursor: pointer; margin-bottom: 10px; font-size: 0.85rem;
    }
    .sessions-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .session-item {
      padding: 10px; background: #242424; border-radius: 6px; cursor: pointer;
      font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center;
      border: 1px solid transparent; transition: all 0.2s;
    }
    .session-item:hover, .session-item.active {
      border-color: var(--primary-color); background: #1c2b30; color: var(--primary-color);
    }
    .session-item span.title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .btn-del-session { color: #ff5252; background: none; border: none; cursor: pointer; font-size: 0.9rem; padding: 0 4px; }

    /* Main Content Container */
    .container {
      flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 8px; gap: 8px; width: 100%;
    }
    
    .stage {
      background: #1a1a1a; border: 1px solid var(--border-color);
      border-radius: 8px; padding: 8px; display: flex; flex-direction: row;
      align-items: center; gap: 10px; flex-shrink: 0;
    }
    .board {
      flex: 1; background: #1c2833; border: 1px solid var(--primary-color);
      border-radius: 6px; padding: 6px 10px; font-size: 0.8rem; color: #a1efef;
      height: 48px; overflow-y: auto; line-height: 1.3;
    }
    .avatar-box { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: radial-gradient(circle, #00bcd4, #006064);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; box-shadow: 0 0 8px rgba(0, 188, 212, 0.4);
    }
    .avatar-title { font-size: 0.65rem; color: var(--primary-color); margin-top: 2px; }

    .chat {
      flex: 1; display: flex; flex-direction: column;
      background: var(--card-bg); border: 1px solid rgba(0, 188, 212, 0.3);
      border-radius: 8px; padding: 8px; overflow: hidden;
    }
    .messages {
      flex: 1; overflow-y: auto; padding: 6px; background: #161616;
      border-radius: 6px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 8px;
    }
    .message {
      padding: 8px 12px; border-radius: 8px;
      max-width: 88%; word-wrap: break-word; line-height: 1.5; font-size: 0.85rem;
      white-space: pre-wrap;
    }
    .ai { background: rgba(0, 188, 212, 0.12); color: #e0f7fa; border: 1px solid rgba(0, 188, 212, 0.3); align-self: flex-start; }
    .user { background: #263238; color: #fff; border: 1px solid #37474f; align-self: flex-end; }
    .thinking { font-style: italic; color: #00bcd4; }
    
    .quick-actions { display: flex; gap: 6px; margin-bottom: 6px; overflow-x: auto; padding-bottom: 2px; }
    .btn-quick {
      background: #1c2b30; border: 1px solid var(--primary-color); color: #e0f7fa;
      padding: 5px 10px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; white-space: nowrap;
    }
    .btn-quick:hover { background: var(--primary-color); color: #000; }

    .input-area { display: flex; gap: 6px; flex-shrink: 0; }
    .input-area input {
      flex: 1; padding: 9px; border: 1px solid var(--primary-color);
      border-radius: 6px; background: #222; color: #fff; font-size: 0.85rem; outline: none;
    }
    .btn-action-send {
      padding: 9px 14px; border: none; border-radius: 6px;
      background: var(--primary-color); color: #000; font-weight: bold; cursor: pointer; font-size: 0.85rem;
    }
    .btn-action-mic {
      padding: 9px 11px; border: none; border-radius: 6px;
      background: #e11d48; color: #fff; font-weight: bold; cursor: pointer; font-size: 0.85rem;
    }
    
    footer {
      text-align: center; padding: 5px; background: #0d0d0d;
      font-size: 0.7rem; color: #888; border-top: 1px solid #222; flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; gap: 10px;">
      <button class="btn-tool" onclick="toggleSidebar()" title="سجل المهن والدروس المحفوظة">📁 المهن المحفوظة</button>
      <div>
        <h1>🎓 أكاديمية المهن - 3D Axis</h1>
        <p>منصة التعليم والتدريب الذكي والتحاور المباشر</p>
      </div>
    </div>
    <div class="header-btns">
      <button class="btn-tool" onclick="exportPDF()" title="تنزيل الدرس الحالي كملف PDF">📄 تصدير PDF</button>
      <button class="btn-tool" onclick="toggleSpeech()" id="soundBtn">🔊 كتم</button>
    </div>
  </header>
  
  <div class="app-body">
    <!-- Sidebar for Career Sessions -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span style="font-size:0.9rem; font-weight:bold; color:var(--primary-color)">🗂️ سجل المهن التعلمية</span>
        <button class="btn-close-sidebar" onclick="toggleSidebar()">✖</button>
      </div>
      <button class="btn-new-chat" onclick="createNewSession()">➕ بدأ تعلم مهنة جديدة</button>
      <div class="sessions-list" id="sessionsList"></div>
    </div>

    <!-- Main Content Area -->
    <div class="container">
      <div class="stage">
        <div class="board" id="boardText">📖 السبورة الافتراضية: اكتب المهنة أو المهارة للبدء في مسار عملي تفاعلي...</div>
        <div class="avatar-box">
          <div class="avatar">👨‍🏫</div>
          <div class="avatar-title">المعلم المهني</div>
        </div>
      </div>
      
      <div class="chat">
        <div class="messages" id="messages"></div>
        
        <div class="quick-actions" id="quickActions">
          <button class="btn-quick" onclick="sendQuickText('الخطوة التالية من فضلك ➡️')">الخطوة التالية ➡️</button>
          <button class="btn-quick" onclick="sendQuickText('أعطني مثالاً عملياً أو عطلاً شائعاً 🤔')">مثال عملي / عطل 🤔</button>
          <button class="btn-quick" onclick="sendQuickText('كرر أو وضح هذا الجزء بأسلوب أبسط 🔄')">توضيح أبسط 🔄</button>
        </div>

        <div class="input-area">
          <input type="text" id="userInput" placeholder="اكتب ردك أو سؤالك هنا..." onkeypress="handleKeyPress(event)">
          <button class="btn-action-mic" onclick="startVoiceInput()" title="تحدث بصوتك">🎙️</button>
          <button class="btn-action-send" onclick="sendMessage()">إرسال</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    إعداد المنصة التعليمية المهنية | الأستاذ عمر حسان عبره
  </footer>

  <script>
    let isSpeechEnabled = true;
    let sessions = [];
    let currentSessionId = null;

    const messagesDiv = document.getElementById("messages");

    window.onload = () => {
      loadSessions();
      if (sessions.length === 0) {
        createNewSession();
      } else {
        switchSession(sessions[0].id);
      }
    };

    function toggleSidebar() {
      const sb = document.getElementById("sidebar");
      sb.classList.toggle("open");
    }

    function toggleSpeech() {
      isSpeechEnabled = !isSpeechEnabled;
      const btn = document.getElementById("soundBtn");
      if (isSpeechEnabled) {
        btn.textContent = "🔊 كتم";
        btn.style.borderColor = "#00bcd4";
        btn.style.background = "#263238";
      } else {
        btn.textContent = "🔇 تشغيل";
        btn.style.borderColor = "#e11d48";
        btn.style.background = "#4c0519";
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    /* LocalStorage Management for Multiple Careers */
    function loadSessions() {
      const saved = localStorage.getItem("3daxis_career_sessions");
      if (saved) {
        try { sessions = JSON.parse(saved); } catch(e) { sessions = []; }
      }
      renderSessionsList();
    }

    function saveSessions() {
      localStorage.setItem("3daxis_career_sessions", JSON.stringify(sessions));
      renderSessionsList();
    }

    function createNewSession() {
      const newId = "sess_" + Date.now();
      const newSession = {
        id: newId,
        title: "مهنة جديدة",
        profession: "",
        messages: [
          { role: "ai", text: "مرحباً بك في أكاديمية المهن منصة 3D Axis! 🎓\nأنا المعلم المهني. ما هي المهنة أو المهارة التي تحلم بإتقانها اليوم؟ (مثال: صيانة اللابتوب، برمجة الويب، الخياطة، النجارة...)" }
        ]
      };
      sessions.unshift(newSession);
      saveSessions();
      switchSession(newId);
      const sb = document.getElementById("sidebar");
      if (sb.classList.contains("open")) toggleSidebar();
    }

    function switchSession(id) {
      currentSessionId = id;
      const session = sessions.find(s => s.id === id);
      if (!session) return;

      messagesDiv.innerHTML = "";
      session.messages.forEach(msg => {
        addMessageUI(msg.text, msg.role);
      });
      renderSessionsList();
      
      const lastAiMsg = [...session.messages].reverse().find(m => m.role === 'ai');
      if (lastAiMsg) {
        document.getElementById("boardText").textContent = "📖 السبورة: " + lastAiMsg.text.substring(0, 90) + "...";
      }
    }

    function deleteSession(id, e) {
      e.stopPropagation();
      sessions = sessions.filter(s => s.id !== id);
      saveSessions();
      if (sessions.length > 0) {
        switchSession(sessions[0].id);
      } else {
        createNewSession();
      }
    }

    function renderSessionsList() {
      const listContainer = document.getElementById("sessionsList");
      listContainer.innerHTML = "";
      sessions.forEach(s => {
        const item = document.createElement("div");
        item.className = "session-item" + (s.id === currentSessionId ? " active" : "");
        item.onclick = () => {
          switchSession(s.id);
          toggleSidebar();
        };

        const title = document.createElement("span");
        title.className = "title";
        title.textContent = s.title;

        const delBtn = document.createElement("button");
        delBtn.className = "btn-del-session";
        delBtn.innerHTML = "✖";
        delBtn.onclick = (e) => deleteSession(s.id, e);

        item.appendChild(title);
        item.appendChild(delBtn);
        listContainer.appendChild(item);
      });
    }

    function addMessageUI(text, sender, extraClass="") {
      const msg = document.createElement("div");
      msg.classList.add("message", sender);
      if(extraClass) msg.classList.add(extraClass);
      msg.textContent = text;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return msg;
    }

    function sendQuickText(text) {
      document.getElementById("userInput").value = text;
      sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      let userText = input.value.trim();
      if(!userText || !currentSessionId) return;

      const activeSession = sessions.find(s => s.id === currentSessionId);
      if(!activeSession) return;

      // تحديد اسم المهنة إذا كانت أول محادثة ولم تُحدد بعد
      if (!activeSession.profession && activeSession.messages.length <= 2) {
        activeSession.profession = userText;
        activeSession.title = userText.substring(0, 20);
      } else if (!activeSession.profession && activeSession.messages.length > 2) {
        activeSession.profession = activeSession.title;
      }

      // إضافة رسالة المستخدم
      activeSession.messages.push({ role: "user", text: userText });
      addMessageUI(userText, "user");
      input.value = "";
      saveSessions();

      const thinkingMsg = addMessageUI("المعلم المهني يفكر ويكتب لك الرد...", "ai", "thinking");

      // تحسين الأداء وحل مشكلة ضغط الـ URL عبر إرسال آخر 6 رسائل فقط مع التعليمات
      const currentProfession = activeSession.profession || "المهنة الحالية";
      let promptText = `أنت معلم مهني تفاعلي لـ 3D Axis. نتعلم حالياً مهنة: "${currentProfession}".
قواعد:
1. اشرح خطوة عملية واحدة فقط بأسلوب مشوق ومبسط باللغة العربية.
2. إذا طلب الطالب مثالاً عملياً أو عطلاً، أعطه مثالاً واقعياً مباشراً يخص "${currentProfession}".
3. إذا قال "الخطوة التالية"، انتقل فوراً للخطوة التي تليها في تعلم "${currentProfession}".
4. لا تسأل عن اسم المهنة مجدداً، واختم دائماً بسؤال تحقق قصير.

سجل المحادثة الأخيرة:
`;
      
      // أخذ آخر 6 رسائل فقط لمنع تجاوز حد طول الرابط
      const recentMessages = activeSession.messages.slice(-6);
      recentMessages.forEach(m => {
        promptText += (m.role === 'user' ? "الطالب: " : "المعلم: ") + m.text + "\n";
      });
      promptText += "المعلم:";

      try {
        const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(promptText)}`);
        thinkingMsg.remove();

        if (response.ok) {
          const aiReply = await response.text();
          activeSession.messages.push({ role: "ai", text: aiReply });
          saveSessions();

          addMessageUI(aiReply, "ai");
          document.getElementById("boardText").textContent = "📖 السبورة: " + aiReply.substring(0, 90) + "...";
          speak(aiReply);
        } else {
          addMessageUI("⚠️ عذراً، الضغط على الخادم مرتفع. أعد محاولة الإرسال أو اضغط زر الخطوة التالية مجدداً.", "ai");
        }
      } catch(error) {
        console.error(error);
        thinkingMsg.remove();
        addMessageUI("⚠️ عذراً، حدث خطأ في الاتصال بالشبكة.", "ai");
      }
    }

    function startVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("متصفحك لا يدعم الإدخال الصوتي المباشر. استخدم الكتابة.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'ar-SA';
      recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        document.getElementById('userInput').value = text;
        sendMessage();
      };
      recognition.start();
    }

    function exportPDF() {
      const activeSession = sessions.find(s => s.id === currentSessionId);
      if (!activeSession || activeSession.messages.length <= 1) {
        alert("لا توجد دروس حالية في هذه المهنة لتصديرها!");
        return;
      }

      const element = document.createElement("div");
      element.style.padding = "25px";
      element.style.fontFamily = "Tahoma, sans-serif";
      element.style.direction = "rtl";
      element.style.backgroundColor = "#ffffff";
      element.style.color = "#111111";
      element.style.lineHeight = "1.6";

      const title = document.createElement("h2");
      title.textContent = `دليل درس مهنة: ${activeSession.title} - منصة 3D Axis`;
      title.style.color = "#00838f";
      title.style.borderBottom = "2px solid #00838f";
      title.style.paddingBottom = "10px";
      title.style.marginBottom = "20px";
      element.appendChild(title);

      activeSession.messages.forEach((msg) => {
        const p = document.createElement("div");
        p.style.marginBottom = "15px";
        p.style.padding = "10px";
        p.style.background = msg.role === 'ai' ? "#f0f8ff" : "#eef2f5";
        p.style.borderRight = msg.role === 'ai' ? "4px solid #00bcd4" : "4px solid #78909c";
        p.style.borderRadius = "4px";
        p.style.whiteSpace = "pre-wrap";
        p.style.fontSize = "14px";
        p.innerHTML = `<strong>${msg.role === 'ai' ? '👨‍🏫 المعلم المهني:' : '👤 المستأجر/الطالب:'}</strong><br>${msg.text}`;
        element.appendChild(p);
      });

      const footerNode = document.createElement("div");
      footerNode.style.marginTop = "30px";
      footerNode.style.textAlign = "center";
      footerNode.style.fontSize = "12px";
      footerNode.style.color = "#666";
      footerNode.textContent = "تم الانتاج والإعداد من منصة 3D Axis التعليمية | الأستاذ عمر حسان عبره";
      element.appendChild(footerNode);

      const opt = {
        margin:       10,
        filename:     `درس_${activeSession.title}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") sendMessage();
    }

    function speak(text) {
      if (!isSpeechEnabled) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/\|/g, ' ').replace(/[-*#_`~–—]/g, ' ').replace(/\s+/g, ' ').trim();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = "ar-SA";
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
