<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>أكاديمية المهن والتعليم الذكي - 3D Axis</title>
  <style>
    :root {
      --primary-color: #00bcd4;
      --primary-hover: #0097a7;
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --border-color: #00bcd4;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg-dark);
      color: #f0f0f0;
      font-family: "Tahoma", sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--card-bg);
      padding: 8px 12px;
      text-align: center;
      border-bottom: 2px solid var(--border-color);
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header div h1 { margin: 0; font-size: 1.1rem; color: var(--primary-color); }
    header div p { margin: 2px 0 0 0; font-size: 0.7rem; color: #aaa; }
    
    .btn-sound {
      background: #263238;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 6px;
      gap: 6px;
    }
    
    .stage {
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .board {
      flex: 1;
      background: #1c2833;
      border: 1px solid var(--primary-color);
      border-radius: 6px;
      padding: 6px;
      font-size: 0.8rem;
      color: #a1efef;
      height: 55px;
      overflow-y: auto;
      line-height: 1.3;
    }
    .avatar-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .avatar {
      width: 35px; height: 35px; border-radius: 50%;
      background: radial-gradient(circle, #00bcd4, #006064);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; box-shadow: 0 0 10px rgba(0, 188, 212, 0.4);
    }
    .avatar-title { font-size: 0.6rem; color: #00bcd4; margin-top: 2px; }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid rgba(0, 188, 212, 0.3);
      border-radius: 8px;
      padding: 6px;
      overflow: hidden;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 4px;
      background: #161616;
      border-radius: 6px;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .message {
      padding: 7px 9px; border-radius: 6px;
      max-width: 88%; word-wrap: break-word; line-height: 1.4; font-size: 0.8rem;
    }
    .ai { background: rgba(0, 188, 212, 0.15); color: #e0f7fa; border: 1px solid rgba(0, 188, 212, 0.3); align-self: flex-start; }
    .user { background: #263238; color: #fff; border: 1px solid #37474f; align-self: flex-end; }
    .thinking { font-style: italic; color: #00bcd4; }
    
    .input-area {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--primary-color);
      border-radius: 6px;
      background: #222;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .btn-action-send {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: var(--primary-color);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-action-mic {
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      background: #e11d48;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }
    
    footer {
      text-align: center;
      padding: 4px;
      background: #0d0d0d;
      font-size: 0.7rem;
      color: #888;
      border-top: 1px solid #222;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🎓 أكاديمية المهن والتعليم الذكي</h1>
      <p>منصة 3D Axis العالمية</p>
    </div>
    <button class="btn-sound" onclick="toggleSpeech()" id="soundBtn">🔊 كتم الصوت</button>
  </header>
  
  <div class="container">
    <div class="stage">
      <div class="board" id="boardText">📖 السبورة الافتراضية: اكتب المهنة أو المهارة أو استخدم الميكروفون للصوت...</div>
      <div class="avatar-box">
        <div class="avatar">👨‍🏫</div>
        <div class="avatar-title">المعلم المهني</div>
      </div>
    </div>
    
    <div class="chat">
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب أو انقر الميكروفون..." onkeypress="handleKeyPress(event)">
        <button class="btn-action-mic" onclick="startVoiceInput()" title="تحدث بصوتك">🎙️</button>
        <button class="btn-action-send" onclick="sendMessage()">إرسال</button>
      </div>
    </div>
  </div>

  <footer>
    إعداد المنصة التعليمية المهنية | الأستاذ عمر حسان عبره
  </footer>

  <script>
    let isSpeechEnabled = true;
    const messagesDiv = document.getElementById("messages");

    function toggleSpeech() {
      isSpeechEnabled = !isSpeechEnabled;
      const btn = document.getElementById("soundBtn");
      if (isSpeechEnabled) {
        btn.textContent = "🔊 كتم الصوت";
        btn.style.borderColor = "#00bcd4";
      } else {
        btn.textContent = "🔇 تشغيل الصوت";
        btn.style.borderColor = "#e11d48";
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }
    }

    function addMessage(text, sender, extraClass="") {
      const msg = document.createElement("div");
      msg.classList.add("message", sender);
      if(extraClass) msg.classList.add(extraClass);
      msg.textContent = text;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return msg;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if(!text) return;

      addMessage(text, "user");
      input.value = "";

      const thinkingMsg = addMessage("جاري إعداد الدرس وخطوات التعلم وروابط الفيديو...", "ai", "thinking");

      const promptText = `أنت معلم وقائد مهني افتراضي خبير وودود تعمل في منصة 3D Axis التعليمية. مهمتك هي تعليم المهن، الحرف، والمهارات التقنية (مثل صيانة الهواتف، النجارة، الإلكترونيات) للشباب بطريقة مبسطة، عملية، وجذابة باللغة العربية. قدم إجابة منظمة تتضمن: 1. نظرة عامة شاملة على المهنة. 2. خطوات التعلم العملية خطوة بخطوة. 3. أدوات ومصادر هامة. 4. اقترح في النهاية رابط فيديو تعليمي مقترح أو كلمات بحث يوتيوب مقترحة للتعلم المرئي. السؤال أو المهنة هي: "${text}"`;

      try {
        const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(promptText)}`);
        thinkingMsg.remove();

        if (response.ok) {
          const aiReply = await response.text();
          addMessage(aiReply, "ai");
          document.getElementById("boardText").textContent = aiReply.substring(0, 100) + "...";
          speak(aiReply);
        } else {
          addMessage("⚠️ عذراً، حدث خطأ في استجابة الخادم.", "ai");
        }
      } catch(error) {
        console.error(error);
        thinkingMsg.remove();
        addMessage("⚠️ عذراً، حدث خطأ في الاتصال بالشبكة.", "ai");
      }
    }

    function startVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("متصفحك لا يدعم الإدخال الصوتي المباشر. استخدم الكتابة.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'ar-SA';
      
      recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        document.getElementById('userInput').value = text;
        sendMessage();
      };
      recognition.start();
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    window.onload = () => {
      const welcome = "مرحباً بك في أكاديمية المهن والتعليم الذكي داخل منصة 3D Axis. ما هي المهنة أو المهارة التي تود إتقانها اليوم؟";
      addMessage(welcome, "ai");
      speak(welcome);
    };

    function speak(text) {
      if (!isSpeechEnabled) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        
        // تنظيف النص تماماً من الرموز والشرطات ليقرأه الصوت ببشاشة وراحة
        const cleanText = text
          .replace(/\|/g, ' ')
          .replace(/[-*#_`~–—]/g, ' ')
          .replace(/\[.*?\]\(.*?\)/g, '')
          .replace(/\s+/g, ' ')
          .trim();

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = "ar-SA";
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
