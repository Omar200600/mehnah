<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>أكاديمية المهن والتعليم الذكي - 3D Axis</title>
  <style>
    :root {
      --primary-color: #00bcd4;
      --primary-hover: #0097a7;
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --border-color: #00bcd4;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg-dark);
      color: #f0f0f0;
      font-family: "Tahoma", sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--card-bg);
      padding: 10px;
      text-align: center;
      border-bottom: 2px solid var(--border-color);
      flex-shrink: 0;
    }
    header h1 { margin: 0; font-size: 1.4rem; color: var(--primary-color); }
    header p { margin: 3px 0 0 0; font-size: 0.8rem; color: #aaa; }
    
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 8px;
      gap: 8px;
    }
    
    .stage {
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .board {
      flex: 1;
      background: #1c2833;
      border: 1px solid var(--primary-color);
      border-radius: 6px;
      padding: 8px;
      font-size: 0.85rem;
      color: #a1efef;
      height: 60px;
      overflow-y: auto;
      line-height: 1.4;
    }
    .avatar-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .avatar {
      width: 45px; height: 45px; border-radius: 50%;
      background: radial-gradient(circle, #00bcd4, #006064);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; box-shadow: 0 0 10px rgba(0, 188, 212, 0.4);
    }
    .avatar-title { font-size: 0.7rem; color: #00bcd4; margin-top: 2px; }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid rgba(0, 188, 212, 0.3);
      border-radius: 8px;
      padding: 8px;
      overflow: hidden;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 5px;
      background: #161616;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .message {
      padding: 8px 10px; border-radius: 6px;
      max-width: 85%; word-wrap: break-word; line-height: 1.4; font-size: 0.85rem;
    }
    .ai { background: rgba(0, 188, 212, 0.15); color: #e0f7fa; border: 1px solid rgba(0, 188, 212, 0.3); align-self: flex-start; }
    .user { background: #263238; color: #fff; border: 1px solid #37474f; align-self: flex-end; }
    .thinking { font-style: italic; color: #00bcd4; }
    
    .input-area {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--primary-color);
      border-radius: 6px;
      background: #222;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .input-area button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: var(--primary-color);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }
    
    footer {
      text-align: center;
      padding: 5px;
      background: #0d0d0d;
      font-size: 0.75rem;
      color: #888;
      border-top: 1px solid #222;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎓 أكاديمية المهن والتعليم الذكي</h1>
    <p>منصة 3D Axis العالمية - تعلم أي مهنة أو مهارة</p>
  </header>
  
  <div class="container">
    <!-- مرحلة السبورة والأفتار بشكل مدمج ومناسب للجوال -->
    <div class="stage">
      <div class="board" id="boardText">📖 السبورة الافتراضية: اكتب المهنة أو المهارة التي تود تعلمها وسيقوم المعلم بتفصيلها لك...</div>
      <div class="avatar-box">
        <div class="avatar">👨‍🏫</div>
        <div class="avatar-title">المعلم المهني</div>
      </div>
    </div>
    
    <!-- قسم المحادثة وصندوق الكتابة الظاهر بوضوح -->
    <div class="chat">
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب المهنة أو المهارة هنا..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">إرسال</button>
      </div>
    </div>
  </div>

  <footer>
    إعداد المنصة التعليمية المهنية | الأستاذ عمر حسان عبره
  </footer>

  <script>
    const messagesDiv = document.getElementById("messages");

    function addMessage(text, sender, extraClass="") {
      const msg = document.createElement("div");
      msg.classList.add("message", sender);
      if(extraClass) msg.classList.add(extraClass);
      msg.textContent = text;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return msg;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if(!text) return;

      addMessage(text, "user");
      input.value = "";

      const thinkingMsg = addMessage("جاري إعداد الدرس وخطوات التعلم...", "ai", "thinking");

      const promptText = `أنت معلم وقائد مهني افتراضي خبير وودود تعمل في منصة 3D Axis التعليمية. مهمتك هي تعليم المهن، الحرف، والمهارات التقنية والعلمية للطلاب والشباب بطريقة مبسطة، عملية، وجذابة باللغة العربية. قدم إجابة منظمة تتضمن: 1. نظرة عامة على المهنة. 2. خطوات التعلم العملية خطوة بخطوة. 3. أدوات ومصادر هامة للبدء. سؤال المستخدم أو المهنة المطلوبة هي: "${text}"`;

      try {
        const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(promptText)}`);
        thinkingMsg.remove();

        if (response.ok) {
          const aiReply = await response.text();
          addMessage(aiReply, "ai");
          document.getElementById("boardText").textContent = aiReply.substring(0, 110) + "...";
          speak(aiReply);
        } else {
          addMessage("⚠️ عذراً، حدث خطأ في استجابة الخادم.", "ai");
        }
      } catch(error) {
        console.error(error);
        thinkingMsg.remove();
        addMessage("⚠️ عذراً، حدث خطأ في الاتصال بالشبكة.", "ai");
      }
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    window.onload = () => {
      const welcome = "مرحباً بك في أكاديمية المهن والتعليم الذكي داخل منصة 3D Axis. ما هي المهنة أو المهارة التي تود إتقانها اليوم؟";
      addMessage(welcome, "ai");
      speak(welcome);
    };

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "ar-SA";
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
