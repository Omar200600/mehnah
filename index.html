<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>أكاديمية المهن والتعليم الذكي - 3D Axis</title>
  <!-- مكتبة html2pdf لتصدير الدرس كـ ملف PDF احترافي -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --primary-color: #00bcd4;
      --primary-hover: #0097a7;
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --border-color: #00bcd4;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg-dark);
      color: #f0f0f0;
      font-family: "Tahoma", sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--card-bg);
      padding: 6px 10px;
      text-align: center;
      border-bottom: 2px solid var(--border-color);
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header div h1 { margin: 0; font-size: 1.1rem; color: var(--primary-color); }
    header div p { margin: 1px 0 0 0; font-size: 0.65rem; color: #aaa; }
    
    .header-btns {
      display: flex;
      gap: 5px;
    }
    .btn-tool {
      background: #263238;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      padding: 4px 7px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 6px;
      gap: 6px;
    }
    
    .stage {
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .board {
      flex: 1;
      background: #1c2833;
      border: 1px solid var(--primary-color);
      border-radius: 6px;
      padding: 6px;
      font-size: 0.8rem;
      color: #a1efef;
      height: 50px;
      overflow-y: auto;
      line-height: 1.3;
    }
    .avatar-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: radial-gradient(circle, #00bcd4, #006064);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; box-shadow: 0 0 8px rgba(0, 188, 212, 0.4);
    }
    .avatar-title { font-size: 0.6rem; color: var(--primary-color); margin-top: 2px; }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid rgba(0, 188, 212, 0.3);
      border-radius: 8px;
      padding: 6px;
      overflow: hidden;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 4px;
      background: #161616;
      border-radius: 6px;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .message {
      padding: 7px 9px; border-radius: 6px;
      max-width: 88%; word-wrap: break-word; line-height: 1.4; font-size: 0.8rem;
      white-space: pre-wrap;
    }
    .ai { background: rgba(0, 188, 212, 0.15); color: #e0f7fa; border: 1px solid rgba(0, 188, 212, 0.3); align-self: flex-start; }
    .user { background: #263238; color: #fff; border: 1px solid #37474f; align-self: flex-end; }
    .thinking { font-style: italic; color: #00bcd4; }
    
    .input-area {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--primary-color);
      border-radius: 6px;
      background: #222;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .btn-action-send {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: var(--primary-color);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-action-mic {
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      background: #e11d48;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }
    
    footer {
      text-align: center;
      padding: 4px;
      background: #0d0d0d;
      font-size: 0.7rem;
      color: #888;
      border-top: 1px solid #222;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🎓 أكاديمية المهن - 3D Axis</h1>
      <p>منصة التعليم والتدريب الذكي</p>
    </div>
    <div class="header-btns">
      <button class="btn-tool" onclick="exportPDF()" title="تنزيل الدرس الحالي كملف PDF">📄 تصدير PDF</button>
      <button class="btn-tool" onclick="toggleSpeech()" id="soundBtn">🔊 كتم</button>
    </div>
  </header>
  
  <div class="container">
    <div class="stage">
      <div class="board" id="boardText">📖 السبورة الافتراضية: اكتب المهنة أو المهارة أو استخدم الميكروفون للصوت...</div>
      <div class="avatar-box">
        <div class="avatar">👨‍🏫</div>
        <div class="avatar-title">المعلم المهني</div>
      </div>
    </div>
    
    <div class="chat">
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب أو انقر الميكروفون..." onkeypress="handleKeyPress(event)">
        <button class="btn-action-mic" onclick="startVoiceInput()" title="تحدث بصوتك">🎙️</button>
        <button class="btn-action-send" onclick="sendMessage()">إرسال</button>
      </div>
    </div>
  </div>

  <footer>
    إعداد المنصة التعليمية المهنية | الأستاذ عمر حسان عبره
  </footer>

  <script>
    let isSpeechEnabled = true;
    let lastProfession = ""; 
    const messagesDiv = document.getElementById("messages");

    function toggleSpeech() {
      isSpeechEnabled = !isSpeechEnabled;
      const btn = document.getElementById("soundBtn");
      if (isSpeechEnabled) {
        btn.textContent = "🔊 كتم";
        btn.style.borderColor = "#00bcd4";
        btn.style.background = "#263238";
      } else {
        btn.textContent = "🔇 تشغيل";
        btn.style.borderColor = "#e11d48";
        btn.style.background = "#4c0519";
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }
    }

    function addMessage(text, sender, extraClass="") {
      const msg = document.createElement("div");
      msg.classList.add("message", sender);
      if(extraClass) msg.classList.add(extraClass);
      msg.textContent = text;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return msg;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      let text = input.value.trim();
      if(!text) return;

      addMessage(text, "user");
      input.value = "";

      let promptText = "";
      if (text.length < 20 && lastProfession && (text.includes("اكمل") || text.includes("تابع") || text.includes("أكمل") || text.includes("تفصيل") || text.includes("شكرا"))) {
        promptText = `بخصوص مهنة أو مهارة ${lastProfession} في منصة 3D Axis، قدم تفاصيل أعمق وأمثلة عملية إضافية وخطوات تقنية متقدمة باللغة العربية.`;
      } else {
        lastProfession = text;
        promptText = `أنت معلم وقائد مهني افتراضي خبير وودود تعمل في منصة 3D Axis التعليمية. مهمتك هي تعليم المهن، الحرف، والمهارات التقنية للشباب بطريقة مبسطة، عملية، وجذابة باللغة العربية. قدم إجابة منظمة تتضمن: 1. نظرة عامة شاملة على المهنة. 2. خطوات التعلم العملية خطوة بخطوة. 3. أدوات ومصادر هامة. 4. اقترح في النهاية روابط فيديو تعليمية أو كلمات بحث يوتيوب مقترحة للتعلم المرئي. المجال أو المهنة المطلوبة هي: "${text}"`;
      }

      const thinkingMsg = addMessage("جاري إعداد الدرس وخطوات التعلم وروابط الفيديو...", "ai", "thinking");

      try {
        const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(promptText)}`);
        thinkingMsg.remove();

        if (response.ok) {
          const aiReply = await response.text();
          addMessage(aiReply, "ai");
          document.getElementById("boardText").textContent = aiReply.substring(0, 100) + "...";
          speak(aiReply);
        } else {
          addMessage("⚠️ عذراً، حدث ضغط مؤقت في الخادم. حاول مرة أخرى.", "ai");
        }
      } catch(error) {
        console.error(error);
        thinkingMsg.remove();
        addMessage("⚠️ عذراً، حدث خطأ في الاتصال بالشبكة.", "ai");
      }
    }

    function startVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("متصفحك لا يدعم الإدخال الصوتي المباشر. استخدم الكتابة.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'ar-SA';
      
      recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        document.getElementById('userInput').value = text;
        sendMessage();
      };
      recognition.start();
    }

    // دالة محسنة ومصححة لتصدير الدرس كملف PDF بخلفية بيضاء ووضوح تام للنص
    function exportPDF() {
      const aiMessages = document.querySelectorAll(".message.ai");
      if (aiMessages.length === 0) {
        alert("لا توجد دروس أو إجابات حالية لتصديرها!");
        return;
      }

      // بناء عنصر نظيف مخصص للطباعة بوضوح عالي
      const element = document.createElement("div");
      element.style.padding = "25px";
      element.style.fontFamily = "Tahoma, sans-serif";
      element.style.direction = "rtl";
      element.style.backgroundColor = "#ffffff";
      element.style.color = "#111111";
      element.style.lineHeight = "1.6";

      const title = document.createElement("h2");
      title.textContent = `دليل درس مهنة: ${lastProfession || 'التعليم المهني'} - منصة 3D Axis`;
      title.style.color = "#00838f";
      title.style.borderBottom = "2px solid #00838f";
      title.style.paddingBottom = "10px";
      title.style.marginBottom = "20px";
      element.appendChild(title);

      // جمع ردود المعلم الذكي فقط ووضعها بوضوح في الملف
      aiMessages.forEach((msg, index) => {
        const p = document.createElement("div");
        p.style.marginBottom = "15px";
        p.style.padding = "10px";
        p.style.background = "#f9f9f9";
        p.style.borderRight = "4px solid #00bcd4";
        p.style.borderRadius = "4px";
        p.style.whiteSpace = "pre-wrap";
        p.style.fontSize = "14px";
        p.textContent = msg.textContent;
        element.appendChild(p);
      });

      const footerNode = document.createElement("div");
      footerNode.style.marginTop = "30px";
      footerNode.style.textAlign = "center";
      footerNode.style.fontSize = "12px";
      footerNode.style.color = "#666";
      footerNode.textContent = "تم الانتاج والإعداد من منصة 3D Axis التعليمية | الأستاذ عمر حسان عبره";
      element.appendChild(footerNode);

      const opt = {
        margin:       10,
        filename:     `درس_${lastProfession || '3D_Axis'}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    window.onload = () => {
      const welcome = "مرحباً بك في أكاديمية المهن والتعليم الذكي داخل منصة 3D Axis. ما هي المهنة أو المهارة التي تود إتقانها اليوم؟";
      addMessage(welcome, "ai");
      speak(welcome);
    };

    function speak(text) {
      if (!isSpeechEnabled) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        
        const cleanText = text
          .replace(/\|/g, ' ')
          .replace(/[-*#_`~–—]/g, ' ')
          .replace(/\[.*?\]\(.*?\)/g, '')
          .replace(/\s+/g, ' ')
          .trim();

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = "ar-SA";
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
